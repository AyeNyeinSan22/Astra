name: smart_bin_flutter
description: "Astra – Smart Bin recycling companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Camera & on-device AI scanner
  camera: ^0.11.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0
  tflite_flutter: ^0.12.0
  image: ^4.1.3

  # HTTP (used by the AI scanner to signal the Arduino bridge)
  http: ^1.2.1

  # ── Firebase ────────────────────────────────────────────────────────────────
  # firebase_core must be initialised before any other Firebase service.
  firebase_core: ^3.8.0
  # firebase_database provides the real-time bin-level stream from Realtime DB.
  firebase_database: ^11.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#F1F4F1"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model.tflite
    - assets/labels.txt
